[package]
authors = ["Johannes Tegnér <johannes@jitesoft.com>"]
description = "Validate Swedish organization numbers"
edition = "2021"
homepage = "https://organisationsnummer.dev"
license = "MIT"
name = "organisationsnummer"
readme = "README.md"
repository = "https://github.com/organisationsnummer/rust"
rust-version = "1.80"
version = "1.0.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
personnummer = "3.1.1"
regex = "1"

[dev-dependencies]
reqwest = {version = "0.13.0", features = ["blocking", "json"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
